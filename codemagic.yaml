workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m1
    environment:
      vars:
        BUNDLE_ID: "com.bonalume.popoff"
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build ipa for distribution
        script: |
          flutter build ipa --release --flavor ios-production -t lib/main_prod.dart
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
